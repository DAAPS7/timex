name = "timex"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
GEMINI_MODEL = "gemini-3.6-flash"

# Accounts and user data. Create the real database with `npx wrangler d1 create timex` and paste its id below.
# The placeholder id only works for local development (`npm run db:migrate:local`).
[[d1_databases]]
binding = "DB"
database_name = "timex"
database_id = "0cb8909f-3684-46a8-baa4-9a122995e201"
migrations_dir = "migrations"
